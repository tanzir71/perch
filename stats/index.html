<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#17221b">
  <title>Perch — Your sites at a glance</title>
  <style>
    :root {
      --ink: #17221b;
      --muted: #66726a;
      --paper: #f4f1e8;
      --card: #fffdf7;
      --line: #dcd8cc;
      --moss: #315f45;
      --moss-soft: #dce9df;
      --lime: #c8e474;
      --orange: #e67a48;
      --shadow: 0 18px 55px rgba(30, 46, 36, .08);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, select, a { font: inherit; }
    button, select { color: inherit; }
    a { color: inherit; }
    .shell { width: min(1440px, calc(100% - 48px)); margin: 0 auto; }
    .topbar {
      position: sticky;
      z-index: 5;
      top: 0;
      border-bottom: 1px solid rgba(23, 34, 27, .12);
      background: rgba(244, 241, 232, .9);
      backdrop-filter: blur(16px);
    }
    .topbar-inner { min-height: 84px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1.08rem; font-weight: 850; letter-spacing: -.035em; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--ink); color: var(--lime); font-weight: 900; }
    .controls { display: flex; align-items: center; gap: 10px; }
    .select-wrap { display: grid; gap: 5px; }
    .select-wrap label { color: var(--muted); font-size: .67rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    select {
      min-width: 190px;
      padding: 10px 36px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      font-weight: 700;
    }
    #range-select { min-width: 115px; }
    .export {
      align-self: end;
      display: inline-flex;
      align-items: center;
      min-height: 41px;
      padding: 0 15px;
      border: 1px solid var(--ink);
      border-radius: 10px;
      text-decoration: none;
      font-size: .88rem;
      font-weight: 800;
    }
    .export:hover { color: var(--paper); background: var(--ink); }
    main { padding: 48px 0 72px; }
    .loading, .error-state, .empty-state {
      min-height: 52vh;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .state-card { max-width: 520px; padding: 42px; border: 1px solid var(--line); border-radius: 24px; background: var(--card); box-shadow: var(--shadow); }
    .state-card h2 { margin: 0 0 10px; font-size: 1.8rem; letter-spacing: -.045em; }
    .state-card p { margin: 0; color: var(--muted); line-height: 1.65; }
    .reload { display: inline-flex; margin-top: 18px; padding: 11px 16px; border-radius: 999px; background: var(--ink); color: #fff; text-decoration: none; font-weight: 800; }
    .spinner { width: 30px; height: 30px; margin: auto; border: 3px solid var(--line); border-top-color: var(--moss); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .heading { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-bottom: 28px; }
    .eyebrow { display: block; margin-bottom: 9px; color: var(--moss); font-size: .75rem; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; }
    h1 { max-width: 850px; margin: 0; font-size: clamp(2.4rem, 5vw, 5rem); line-height: .95; letter-spacing: -.07em; }
    .lede { max-width: 650px; margin: 14px 0 0; color: var(--muted); line-height: 1.6; }
    .period { color: var(--muted); font-size: .83rem; font-weight: 700; white-space: nowrap; }
    .insight {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 20px 22px;
      border-radius: 16px;
      background: var(--ink);
      color: #fff;
    }
    .insight strong { color: var(--lime); }
    .insight span { color: #c7d0ca; font-size: .84rem; }
    .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { min-width: 0; padding: 20px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: 0 8px 24px rgba(30, 46, 36, .035); }
    .kpi.live { background: var(--moss-soft); border-color: #bfd4c4; }
    .kpi-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .76rem; font-weight: 800; letter-spacing: .035em; text-transform: uppercase; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #39a365; box-shadow: 0 0 0 4px rgba(57,163,101,.14); }
    .kpi-value { display: block; margin-top: 12px; font-size: clamp(1.65rem, 2.5vw, 2.55rem); line-height: 1; font-weight: 850; letter-spacing: -.055em; }
    .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
    .card { min-width: 0; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
    .card.wide { grid-column: span 8; }
    .card.narrow { grid-column: span 4; }
    .card.half { grid-column: span 6; }
    .card.full { grid-column: 1 / -1; }
    .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    .card h2 { margin: 0; font-size: 1rem; letter-spacing: -.025em; }
    .card-note { color: var(--muted); font-size: .75rem; }
    .chart { width: 100%; height: 260px; display: block; }
    .chart.short { height: 220px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { padding: 14px 12px; border-bottom: 1px solid #ebe7dc; text-align: right; white-space: nowrap; }
    th { color: var(--muted); font-size: .69rem; letter-spacing: .07em; text-transform: uppercase; }
    th:first-child, td:first-child { padding-left: 0; text-align: left; }
    th:last-child, td:last-child { padding-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    .project-row { cursor: pointer; }
    .project-row:hover { background: #f7f4ec; }
    .project-row:focus { outline: 2px solid var(--moss); outline-offset: -2px; }
    .project-name { display: grid; gap: 3px; font-weight: 800; }
    .project-name small { color: var(--muted); font-weight: 500; }
    .rank { display: inline-grid; width: 25px; height: 25px; margin-right: 10px; place-items: center; border-radius: 8px; background: var(--moss-soft); color: var(--moss); font-size: .73rem; }
    .spark { width: 110px; height: 34px; display: block; margin-left: auto; }
    .break-list { display: grid; gap: 13px; }
    .break-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 14px; align-items: center; }
    .break-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .86rem; font-weight: 700; }
    .break-value { font-size: .82rem; font-variant-numeric: tabular-nums; }
    .bar { grid-column: 1 / -1; height: 5px; overflow: hidden; border-radius: 99px; background: #ece8dc; }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--moss); }
    .mini-empty { padding: 22px 0; color: var(--muted); font-size: .86rem; }
    .footer-note { margin-top: 24px; color: var(--muted); font-size: .75rem; text-align: center; }
    @media (max-width: 1050px) {
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card.wide, .card.narrow, .card.half { grid-column: span 6; }
    }
    @media (max-width: 760px) {
      .shell { width: min(100% - 28px, 1440px); }
      .topbar { position: static; }
      .topbar-inner { align-items: flex-start; padding: 18px 0; }
      .brand span:last-child { display: none; }
      .controls { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 110px; }
      .select-wrap:first-child { min-width: 0; }
      select { width: 100%; min-width: 0; }
      .export { grid-column: 1 / -1; justify-content: center; }
      main { padding-top: 32px; }
      .heading { grid-template-columns: 1fr; }
      .period { white-space: normal; }
      .insight { align-items: flex-start; flex-direction: column; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card.wide, .card.narrow, .card.half { grid-column: 1 / -1; }
      .chart { height: 220px; }
      th, td { padding-top: 12px; padding-bottom: 12px; }
    }
    @media (max-width: 430px) {
      .kpis { grid-template-columns: 1fr 1fr; }
      .kpi { padding: 16px; }
      .kpi-value { font-size: 1.65rem; }
      .card { padding: 19px; border-radius: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/" aria-label="Perch dashboard home">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span>Perch</span>
      </a>
      <div class="controls">
        <div class="select-wrap">
          <label for="project-select">View</label>
          <select id="project-select" aria-label="Choose a project">
            <option value="all">All projects</option>
          </select>
        </div>
        <div class="select-wrap">
          <label for="range-select">Period</label>
          <select id="range-select" aria-label="Choose a date range">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </div>
        <a class="export" id="export-link" href="/api/export.csv">Export CSV</a>
      </div>
    </div>
  </header>
  <main class="shell" id="app" aria-live="polite">
    <div class="loading"><div><div class="spinner" aria-hidden="true"></div><p>Finding your vantage point…</p></div></div>
  </main>

  <script>
    (function () {
      "use strict";

      var app = document.querySelector("#app");
      var projectSelect = document.querySelector("#project-select");
      var rangeSelect = document.querySelector("#range-select");
      var exportLink = document.querySelector("#export-link");
      var query = new URLSearchParams(location.search);
      var endpointOverride = query.get("endpoint");
      var apiBase = endpointOverride ? endpointOverride.replace(/\/+$/, "") : "";
      var state = {
        projects: [],
        selected: readPreference("perch:last-project", "all"),
        days: Number(readPreference("perch:date-range", "30")) || 30,
        globalSort: "pageviews",
        globalDirection: -1
      };

      function readPreference(key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
      }

      function savePreference(key, value) {
        try { localStorage.setItem(key, value); } catch (_) {}
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[character];
        });
      }

      function fmt(value, maximumFractionDigits) {
        return new Intl.NumberFormat(undefined, {
          maximumFractionDigits: maximumFractionDigits == null ? 0 : maximumFractionDigits
        }).format(Number(value) || 0);
      }

      function percent(value) {
        return fmt((Number(value) || 0) * 100, 1) + "%";
      }

      function range() {
        var to = new Date();
        var from = new Date(Date.UTC(to.getUTCFullYear(), to.getUTCMonth(), to.getUTCDate() - state.days + 1));
        var iso = function (date) { return date.toISOString().slice(0, 10); };
        return { from: iso(from), to: iso(to) };
      }

      function apiUrl(path) {
        return apiBase + path;
      }

      function AuthError() {
        this.name = "AuthError";
      }
      AuthError.prototype = Object.create(Error.prototype);

      async function getJson(path) {
        var response = await fetch(apiUrl(path), {
          headers: { "accept": "application/json" },
          redirect: "manual"
        });
        if (response.status === 401 || response.status === 302 || response.type === "opaqueredirect") {
          throw new AuthError();
        }
        var contentType = response.headers.get("content-type") || "";
        if (!response.ok) throw new Error("The data service returned " + response.status + ".");
        if (!contentType.includes("application/json")) throw new AuthError();
        return response.json();
      }

      function setLoading() {
        app.innerHTML = '<div class="loading"><div><div class="spinner" aria-hidden="true"></div><p>Gathering the view…</p></div></div>';
      }

      function showError(error) {
        var auth = error && error.name === "AuthError";
        app.innerHTML = '<div class="error-state"><section class="state-card">' +
          '<h2>' + (auth ? "Please sign in again" : "The view is temporarily cloudy") + '</h2>' +
          '<p>' + (auth
            ? "Your secure dashboard session has expired. Reload to sign in through Cloudflare Access."
            : "Perch could not load your analytics. Check the Worker and database, then try once more.") + '</p>' +
          '<a class="reload" href="' + escapeHtml(location.href) + '">Reload dashboard</a>' +
          '</section></div>';
      }

      function updateExport() {
        var dates = range();
        var params = new URLSearchParams({ from: dates.from, to: dates.to });
        if (state.selected !== "all") params.set("projectId", state.selected);
        exportLink.href = apiUrl("/api/export.csv?" + params);
      }

      function metric(label, value, live) {
        return '<article class="kpi' + (live ? " live" : "") + '">' +
          '<span class="kpi-label">' + (live ? '<i class="live-dot" aria-hidden="true"></i>' : "") + escapeHtml(label) + '</span>' +
          '<strong class="kpi-value">' + escapeHtml(value) + '</strong></article>';
      }

      function drawLine(canvas, series, colors) {
        if (!canvas || typeof canvas.getContext !== "function") return;
        var context = canvas.getContext("2d");
        if (!context) return;
        var ratio = window.devicePixelRatio || 1;
        var width = canvas.clientWidth || 600;
        var height = canvas.clientHeight || 220;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        context.scale(ratio, ratio);
        context.clearRect(0, 0, width, height);
        var pad = { top: 16, right: 10, bottom: 25, left: 34 };
        var values = series.flatMap(function (item) { return item.values; });
        var max = Math.max.apply(null, values.concat([1]));
        context.strokeStyle = "#ddd8cc";
        context.lineWidth = 1;
        context.font = "11px Inter, sans-serif";
        context.fillStyle = "#778078";
        for (var grid = 0; grid < 4; grid++) {
          var y = pad.top + (height - pad.top - pad.bottom) * grid / 3;
          context.beginPath();
          context.moveTo(pad.left, y);
          context.lineTo(width - pad.right, y);
          context.stroke();
          context.fillText(fmt(max * (3 - grid) / 3), 0, y + 4);
        }
        series.forEach(function (item, index) {
          context.strokeStyle = colors[index] || "#315f45";
          context.lineWidth = 2.4;
          context.lineJoin = "round";
          context.beginPath();
          item.values.forEach(function (value, point) {
            var x = pad.left + (width - pad.left - pad.right) * (point / Math.max(item.values.length - 1, 1));
            var y = height - pad.bottom - (height - pad.top - pad.bottom) * (value / max);
            if (point === 0) context.moveTo(x, y); else context.lineTo(x, y);
          });
          context.stroke();
        });
      }

      function drawBars(canvas, items) {
        if (!canvas || typeof canvas.getContext !== "function") return;
        var context = canvas.getContext("2d");
        if (!context) return;
        var ratio = window.devicePixelRatio || 1;
        var width = canvas.clientWidth || 600;
        var height = canvas.clientHeight || 220;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        context.scale(ratio, ratio);
        context.clearRect(0, 0, width, height);
        var max = Math.max.apply(null, items.map(function (item) { return item.pageviews; }).concat([1]));
        var rowHeight = Math.min(46, (height - 10) / Math.max(items.length, 1));
        context.font = "12px Inter, sans-serif";
        items.slice(0, 5).forEach(function (item, index) {
          var y = 8 + index * rowHeight;
          context.fillStyle = "#66726a";
          context.fillText(item.name.slice(0, 18), 0, y + 12);
          context.fillStyle = "#e4e0d5";
          context.fillRect(0, y + 19, width, 11);
          context.fillStyle = index === 0 ? "#c8e474" : "#315f45";
          context.fillRect(0, y + 19, width * item.pageviews / max, 11);
        });
      }

      function drawSparklines() {
        document.querySelectorAll("canvas.spark").forEach(function (canvas) {
          var values = (canvas.dataset.values || "").split(",").map(Number);
          drawLine(canvas, [{ values: values.length ? values : [0] }], ["#315f45"]);
        });
      }

      function heading(eyebrow, title, description, dates) {
        return '<header class="heading"><div><span class="eyebrow">' + escapeHtml(eyebrow) + '</span>' +
          '<h1>' + escapeHtml(title) + '</h1><p class="lede">' + escapeHtml(description) + '</p></div>' +
          '<span class="period">' + escapeHtml(dates.from) + " — " + escapeHtml(dates.to) + '</span></header>';
      }

      function emptyState(projectName) {
        return heading("Project view", projectName, "A clear view of this landing page.", range()) +
          '<div class="empty-state"><section class="state-card"><h2>No data yet</h2>' +
          '<p>Events will appear here once your page gets traffic. Open the tracked site once to send its first pageview.</p></section></div>';
      }

      function renderGlobal(items) {
        var dates = range();
        var sorted = items.slice().sort(function (a, b) {
          var aValue = state.globalSort === "name" ? a.name.toLowerCase() : Number(a[state.globalSort]) || 0;
          var bValue = state.globalSort === "name" ? b.name.toLowerCase() : Number(b[state.globalSort]) || 0;
          if (aValue < bValue) return -1 * state.globalDirection;
          if (aValue > bValue) return 1 * state.globalDirection;
          return 0;
        });
        var total = function (key) { return items.reduce(function (sum, item) { return sum + (Number(item[key]) || 0); }, 0); };
        var leader = items.slice().sort(function (a, b) {
          return (Number(b.pageviews) || 0) - (Number(a.pageviews) || 0);
        })[0];
        var rows = sorted.map(function (item, index) {
          return '<tr class="project-row" tabindex="0" data-project="' + escapeHtml(item.projectId) + '" aria-label="Open ' + escapeHtml(item.name) + '">' +
            '<td><span class="rank">' + (index + 1) + '</span><span class="project-name">' + escapeHtml(item.name) +
              '<small>' + escapeHtml(item.origin || item.projectId) + '</small></span></td>' +
            '<td>' + fmt(item.pageviews) + '</td><td>' + fmt(item.uniques) + '</td><td>' + fmt(item.sessions) + '</td>' +
            '<td>' + fmt(item.realtime) + '</td><td><canvas class="spark" data-values="' +
              escapeHtml((item.byDay || []).map(function (day) { return Number(day.pv) || 0; }).join(",")) +
              '" aria-label="Traffic trend for ' + escapeHtml(item.name) + '"></canvas></td></tr>';
        }).join("");

        app.innerHTML = heading(
          "Portfolio overview",
          "All your sites, one quiet view.",
          "See what is drawing attention now, then open any project for the full story.",
          dates
        ) +
          (leader ? '<div class="insight"><div><strong>' + escapeHtml(leader.name) + '</strong> is attracting the most traffic this period.</div>' +
            '<span>' + fmt(leader.pageviews) + ' pageviews</span></div>' : "") +
          '<section class="kpis" aria-label="Portfolio totals">' +
            metric("Pageviews", fmt(total("pageviews"))) +
            metric("Unique visitors", fmt(total("uniques"))) +
            metric("Sessions", fmt(total("sessions"))) +
            metric("Visitors now", fmt(total("realtime")), true) +
            metric("Projects", fmt(items.length)) +
          '</section>' +
          '<section class="grid">' +
            '<article class="card narrow"><div class="card-head"><h2>Top projects</h2><span class="card-note">By pageviews</span></div>' +
              (items.length ? '<canvas class="chart short" id="portfolio-bars" aria-label="Pageviews by project"></canvas>' : '<p class="mini-empty">No project traffic yet.</p>') +
            '</article>' +
            '<article class="card wide"><div class="card-head"><h2>Project ranking</h2><span class="card-note">Select a row for detail</span></div>' +
              '<div class="table-wrap"><table><thead><tr>' +
                '<th><button type="button" data-sort="name">Project</button></th>' +
                '<th><button type="button" data-sort="pageviews">Pageviews</button></th>' +
                '<th><button type="button" data-sort="uniques">Unique visitors</button></th>' +
                '<th><button type="button" data-sort="sessions">Sessions</button></th>' +
                '<th><button type="button" data-sort="realtime">Live now</button></th><th>Trend</th>' +
              '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '</article>' +
          '</section>' +
          '<p class="footer-note">Full data, no sampling. Realtime shows visitors active in the last five minutes.</p>';

        drawBars(document.querySelector("#portfolio-bars"), items);
        drawSparklines();

        document.querySelectorAll("[data-sort]").forEach(function (button) {
          button.addEventListener("click", function () {
            var key = button.dataset.sort;
            if (state.globalSort === key) state.globalDirection *= -1;
            else {
              state.globalSort = key;
              state.globalDirection = key === "name" ? 1 : -1;
            }
            renderGlobal(items);
          });
        });
        document.querySelectorAll(".project-row").forEach(function (row) {
          function open() {
            state.selected = row.dataset.project;
            projectSelect.value = state.selected;
            savePreference("perch:last-project", state.selected);
            render();
          }
          row.addEventListener("click", open);
          row.addEventListener("keydown", function (event) {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              open();
            }
          });
        });
      }

      function countryLabel(code) {
        if (!code || code === "(unknown)" || code === "XX") return "🌐 Unknown";
        var flag = String(code).toUpperCase().replace(/./g, function (character) {
          return String.fromCodePoint(127397 + character.charCodeAt());
        });
        try {
          var names = new Intl.DisplayNames([navigator.language || "en"], { type: "region" });
          return flag + " " + names.of(String(code).toUpperCase());
        } catch (_) {
          return flag + " " + code;
        }
      }

      function breakdown(title, items, transform) {
        var max = Math.max.apply(null, (items || []).map(function (item) { return Number(item.events) || 0; }).concat([1]));
        var content = (items || []).slice(0, 10).map(function (item) {
          var label = transform ? transform(item.name) : item.name;
          return '<div class="break-row"><span class="break-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span>' +
            '<span class="break-value">' + fmt(item.events) + '</span><div class="bar"><span style="width:' +
            Math.max(2, (Number(item.events) || 0) / max * 100) + '%"></span></div></div>';
        }).join("");
        return '<article class="card half"><div class="card-head"><h2>' + escapeHtml(title) + '</h2><span class="card-note">Events</span></div>' +
          (content ? '<div class="break-list">' + content + '</div>' : '<p class="mini-empty">Nothing to show for this period.</p>') +
          '</article>';
      }

      function renderDetail(data) {
        var project = state.projects.find(function (item) { return item.id === state.selected; });
        var projectName = project ? project.name : state.selected;
        if (!data.totals || Number(data.totals.pageviews) === 0) {
          app.innerHTML = emptyState(projectName);
          return;
        }
        var totals = data.totals;
        var dates = data.range || range();
        app.innerHTML = heading(
          "Project detail",
          projectName,
          "Traffic, attention, and outcomes for this site.",
          dates
        ) +
          '<section class="kpis" aria-label="Project totals">' +
            metric("Visitors now", fmt(totals.realtime), true) +
            metric("Pageviews", fmt(totals.pageviews)) +
            metric("Unique visitors", fmt(totals.uniques)) +
            metric("Sessions", fmt(totals.sessions)) +
            metric("Conversion rate", percent(totals.conversionRate)) +
            metric("Bounce rate", percent(totals.bounceRate)) +
            metric("Pages / session", fmt(totals.pagesPerSession, 1)) +
          '</section>' +
          '<section class="grid">' +
            '<article class="card full"><div class="card-head"><h2>Traffic over time</h2><span class="card-note">Pageviews · Unique visitors</span></div>' +
              '<canvas class="chart" id="detail-chart" aria-label="Daily pageviews and unique visitors"></canvas></article>' +
            breakdown("Top pages", data.byPath || []) +
            breakdown("Entry pages", data.entryPages || []) +
            breakdown("Countries", data.byCountry || [], countryLabel) +
            breakdown("Referrers", data.byReferrer || []) +
            breakdown("UTM sources", data.bySource || []) +
            breakdown("Devices", data.byDevice || []) +
            breakdown("Browsers", data.byBrowser || []) +
            breakdown("Operating systems", data.byOS || []) +
            breakdown("Languages", data.byLanguage || []) +
            breakdown("CTA leaderboard", data.byCta || []) +
            breakdown("Outbound links", data.topOutbound || []) +
          '</section>' +
          '<p class="footer-note">Sessions use a 30-minute window. Visitors are anonymous daily hashes that never store a raw IP.</p>';
        var days = data.byDay || [];
        drawLine(document.querySelector("#detail-chart"), [
          { values: days.map(function (day) { return Number(day.pv) || 0; }) },
          { values: days.map(function (day) { return Number(day.uv) || 0; }) }
        ], ["#315f45", "#e67a48"]);
      }

      async function render() {
        setLoading();
        updateExport();
        var dates = range();
        try {
          if (state.selected === "all") {
            var overview = await getJson("/api/overview?from=" + dates.from + "&to=" + dates.to);
            renderGlobal(overview);
          } else {
            var rollup = await getJson("/api/rollup?projectId=" + encodeURIComponent(state.selected) +
              "&from=" + dates.from + "&to=" + dates.to);
            renderDetail(rollup);
          }
        } catch (error) {
          showError(error);
        }
      }

      async function init() {
        try {
          state.projects = await getJson("/api/projects");
          state.projects.forEach(function (project) {
            var option = document.createElement("option");
            option.value = project.id;
            option.textContent = project.name;
            projectSelect.appendChild(option);
          });
          if (state.selected !== "all" && !state.projects.some(function (project) { return project.id === state.selected; })) {
            state.selected = "all";
          }
          if (![7, 30, 90].includes(state.days)) state.days = 30;
          projectSelect.value = state.selected;
          rangeSelect.value = String(state.days);
          await render();
        } catch (error) {
          showError(error);
        }
      }

      projectSelect.addEventListener("change", function () {
        state.selected = projectSelect.value;
        savePreference("perch:last-project", state.selected);
        render();
      });
      rangeSelect.addEventListener("change", function () {
        state.days = Number(rangeSelect.value) || 30;
        savePreference("perch:date-range", String(state.days));
        render();
      });

      init();
    })();
  </script>
</body>
</html>
