<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#12201A">
  <meta name="robots" content="noindex">
  <title>Perch — Your sites at a glance</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 96 96%22%3E%3Crect width=%2296%22 height=%2296%22 rx=%2224%22 fill=%22%2312201A%22/%3E%3Cg transform=%22translate%280 -3%29%22%3E%3Cpath fill=%22%23C8E474%22 d=%22M63 69H24A39 39 0 0 1 63 30Z%22/%3E%3Ccircle fill=%22%23C8E474%22 cx=%2263%22 cy=%2231.5%22 r=%229%22/%3E%3Cpath fill=%22%23C8E474%22 d=%22M70.8 27.3 81 31.5 70.8 35.7Z%22/%3E%3Crect fill=%22%23fff%22 x=%2215%22 y=%2275%22 width=%2266%22 height=%225.25%22 rx=%222.625%22/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
  <style>
    :root {
      --ink: #12201a;
      --canvas: #fff;
      --subtle: #f6f5f0;
      --tint: #eef4ef;
      --line: #e4e2da;
      --line-strong: #cfccc1;
      --text-2: #4c5951;
      --muted: #66716a;
      --moss: #2f6045;
      --moss-strong: #234a35;
      --moss-soft: #e3eee6;
      --lime: #c8e474;
      --lime-soft: #f0f7d9;
      --coral: #e5774c;
      --coral-soft: #fbe9e1;
      --live: #2e9e5b;
      --up: #23774a;
      --down: #b4472a;
      --warn: #9a6a12;
      --warn-soft: #fbf0d6;
      --shadow: 0 16px 48px -24px rgba(18, 32, 26, .18), 0 1px 3px rgba(18, 32, 26, .05);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--subtle);
      font-synthesis: none;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-width: 320px; min-height: 100vh; }
    button, select, input, a { font: inherit; color: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .shell { width: min(1440px, calc(100% - 48px)); margin: 0 auto; }
    .bar { position: sticky; z-index: 10; top: 0; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .94); backdrop-filter: blur(12px); }
    .bar-inner { min-height: 64px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; }
    .brand { display: inline-flex; align-items: center; margin-right: 14px; color: var(--ink, #12201a); text-decoration: none; }
    .brand .wordmark { display: block; width: auto; height: 26px; }
    .brand .perched { fill: #2f6045; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    select, input[type="date"] { height: 36px; padding: 0 30px 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--canvas); font-size: .86rem; font-weight: 600; }
    input[type="date"] { padding-right: 8px; }
    #project-select { min-width: 170px; }
    .custom-range { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; }
    .toggle { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--subtle); font-size: .82rem; font-weight: 600; cursor: pointer; }
    .toggle input { accent-color: var(--moss); margin: 0; }
    .grow { flex: 1; }
    .live { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; background: var(--moss-soft); color: var(--moss); font-size: .8rem; font-weight: 650; white-space: nowrap; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 3px rgba(46, 158, 91, .15); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--canvas); text-decoration: none; font-size: .86rem; font-weight: 650; white-space: nowrap; }
    .btn:hover { border-color: var(--ink); }
    .btn.primary { border-color: var(--moss); background: var(--moss); color: #fff; }
    .btn.primary:hover { background: var(--moss-strong); }
    .btn.small { height: 30px; padding: 0 10px; font-size: .8rem; }
    .demo-banner { border-bottom: 1px solid #e9d27a; background: #fff4c2; font-size: .84rem; }
    .demo-banner .shell { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 9px 0; }
    main { padding: 28px 0 64px; }
    .state { min-height: 50vh; display: grid; place-items: center; text-align: center; }
    .state-card { max-width: 520px; padding: 36px; border: 1px solid var(--line); border-radius: 16px; background: var(--canvas); box-shadow: var(--shadow); }
    .state-card h2 { margin: 0 0 8px; font-size: 1.5rem; letter-spacing: -.03em; }
    .state-card p { margin: 0 0 18px; color: var(--text-2); line-height: 1.6; }
    .spinner { width: 28px; height: 28px; margin: auto; border: 3px solid var(--line); border-top-color: var(--moss); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.035em; }
    .sub { margin: 5px 0 0; color: var(--muted); font-size: .86rem; }
    .sub a { color: var(--moss); }
    .insight { margin: 0 0 16px; color: var(--text-2); font-size: .92rem; }
    .insight strong { color: var(--ink); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: -4px 0 16px; }
    .chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 6px 0 12px; border: 1px solid var(--lime); border-radius: 8px; background: var(--lime-soft); font-size: .82rem; font-weight: 600; }
    .chip button { width: 22px; height: 22px; border: 0; border-radius: 6px; background: transparent; line-height: 1; }
    .chip button:hover { background: rgba(18, 32, 26, .08); }
    .link-btn { border: 0; background: none; color: var(--moss); font-size: .82rem; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
    .kpis { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); margin-bottom: 16px; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .kpi { position: relative; display: grid; gap: 6px; min-width: 0; padding: 16px 20px; border: 0; border-right: 1px solid var(--line); background: none; text-align: left; }
    .kpi:last-child { border-right: 0; }
    button.kpi:hover { background: var(--subtle); }
    .kpi[aria-pressed="true"] { background: var(--lime-soft); }
    .kpi[aria-pressed="true"]::before { content: ""; position: absolute; top: 0; left: 20px; width: 64px; height: 3px; background: var(--moss); }
    .kpi.warn { background: var(--warn-soft); }
    .kpi-label { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8rem; font-weight: 550; }
    .kpi[aria-pressed="true"] .kpi-label { color: var(--ink); font-weight: 650; }
    .kpi-value { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .kpi-value strong { font-size: 1.65rem; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .kpi.warn strong { color: var(--warn); }
    .delta { font-size: .78rem; font-weight: 650; white-space: nowrap; }
    .delta.up { color: var(--up); }
    .delta.down { color: var(--down); }
    .delta.flat { color: var(--muted); }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--canvas); }
    .card-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-size: .95rem; letter-spacing: -.01em; }
    .card-note { color: var(--muted); font-size: .78rem; }
    .chart-card { margin-bottom: 16px; }
    .legend { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .78rem; }
    .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; border-radius: 2px; vertical-align: middle; background: var(--moss); }
    .legend i.prev { background: var(--line-strong); }
    .chart-wrap { position: relative; padding: 14px 18px 12px; }
    .chart-wrap svg { display: block; width: 100%; height: 220px; overflow: visible; }
    .axis { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: .74rem; }
    .tooltip { position: absolute; z-index: 2; min-width: 170px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: #fff; font-size: .78rem; pointer-events: none; transform: translate(-50%, -100%); box-shadow: var(--shadow); }
    .tooltip b { display: block; margin-bottom: 2px; }
    .tooltip span { color: var(--lime); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
    .stack { display: grid; gap: 16px; }
    .tabs { display: inline-flex; gap: 2px; margin-left: auto; padding: 2px; border-radius: 8px; background: var(--subtle); }
    .tabs button { height: 26px; padding: 0 9px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); font-size: .76rem; font-weight: 600; }
    .tabs button[aria-selected="true"] { border-color: var(--line); background: var(--canvas); color: var(--ink); }
    .list { display: grid; gap: 4px; padding: 10px 12px 14px; }
    .list-head { display: flex; justify-content: space-between; padding: 0 10px 4px; color: var(--muted); font: 600 .7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .04em; }
    .row { position: relative; display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 10px; overflow: hidden; border: 0; border-radius: 6px; background: none; text-align: left; font-size: .84rem; width: 100%; }
    .row .fill { position: absolute; inset: 0 auto 0 0; z-index: 0; border-radius: 6px; background: var(--moss-soft); }
    .row > *:not(.fill) { position: relative; z-index: 1; }
    button.row:hover .fill, button.row:focus-visible .fill { background: #d2e4d7; }
    .row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .row-extra { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .row-value { min-width: 44px; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
    .tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; background: var(--lime-soft); color: var(--moss-strong); font: 600 .68rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; }
    .tag.warn { background: var(--coral-soft); color: var(--down); }
    .tag.neutral { background: var(--subtle); color: var(--text-2); }
    .empty { padding: 18px; color: var(--muted); font-size: .84rem; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    th { background: var(--subtle); color: var(--muted); font: 600 .7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-transform: uppercase; letter-spacing: .04em; }
    th button { border: 0; background: none; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
    th:first-child, td:first-child { text-align: left; padding-left: 18px; }
    tbody tr:last-child td { border-bottom: 0; }
    .project-row { cursor: pointer; }
    .project-row:hover, .project-row:focus { background: var(--subtle); outline: none; }
    .project-row:focus-visible { box-shadow: inset 3px 0 0 var(--moss); }
    .pname { display: grid; gap: 1px; }
    .pname strong { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; }
    .pname small { color: var(--muted); }
    .rank { display: inline-grid; width: 22px; height: 22px; margin-right: 10px; place-items: center; border-radius: 6px; background: var(--subtle); font-size: .72rem; font-weight: 700; }
    .rank.first { background: var(--lime); }
    .spark { display: block; width: 104px; height: 26px; margin-left: auto; }
    .attention { display: grid; }
    .alert { display: flex; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--line); font-size: .84rem; }
    .alert:last-child { border-bottom: 0; }
    .alert-icon { flex: none; display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: var(--coral-soft); color: var(--down); font-weight: 700; }
    .alert-icon.good { background: var(--moss-soft); color: var(--moss); }
    .alert p { margin: 2px 0 0; color: var(--text-2); font-size: .8rem; line-height: 1.45; }
    .vitals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 18px 18px; }
    .vital { padding: 12px; border-radius: 10px; background: var(--subtle); }
    .vital strong { display: block; margin-top: 6px; font-size: 1.25rem; letter-spacing: -.03em; }
    .vital small { color: var(--muted); font-size: .74rem; }
    .vital.good strong { color: var(--up); }
    .vital.poor strong { color: var(--down); }
    .vital.mid strong { color: var(--warn); }
    .footer-note { margin-top: 20px; color: var(--muted); font-size: .76rem; text-align: center; }
    .install { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
    .install-head { display: grid; gap: 6px; padding: 22px 24px; border-bottom: 1px solid var(--line); }
    .install-head h2 { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.25rem; letter-spacing: -.03em; }
    .pulse { width: 16px; height: 16px; border-radius: 50%; background: var(--lime); box-shadow: inset 0 0 0 4px var(--lime), inset 0 0 0 8px var(--moss); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: inset 0 0 0 4px var(--lime), inset 0 0 0 8px var(--moss), 0 0 0 6px rgba(200, 228, 116, .35); } }
    .step { display: flex; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
    .step:last-child { border-bottom: 0; }
    .mark { flex: none; display: grid; width: 28px; height: 28px; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; color: var(--muted); font-size: .8rem; font-weight: 700; }
    .mark.done { border-color: var(--moss); background: var(--moss); color: #fff; }
    .mark.next { border-color: var(--moss); background: var(--lime-soft); color: var(--moss); }
    .step h3 { display: flex; align-items: center; gap: 8px; margin: 3px 0 4px; font-size: .95rem; }
    .step p { margin: 0; color: var(--text-2); font-size: .86rem; line-height: 1.5; }
    .code { position: relative; margin-top: 12px; overflow-x: auto; border-radius: 10px; background: #0e1612; color: #dce9df; }
    .code pre { margin: 0; padding: 16px; font: .8rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .code .btn { position: absolute; top: 8px; right: 8px; height: 28px; border-color: #2e3f36; background: transparent; color: #fff; font-size: .76rem; }
    .actions-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; color: var(--muted); font-size: .8rem; }
    .agent { padding: 18px 20px; border-radius: 12px; background: var(--ink); color: #fff; }
    .agent h3 { margin: 0 0 8px; font-size: .95rem; }
    .agent p { margin: 0 0 12px; color: #a7b4ab; font-size: .84rem; line-height: 1.5; }
    .agent .btn { border-color: var(--lime); background: var(--lime); color: var(--ink); }
    .toast { position: fixed; z-index: 20; right: 20px; bottom: 20px; padding: 10px 14px; border-radius: 9px; background: var(--ink); color: #fff; font-size: .84rem; box-shadow: var(--shadow); }
    @media (max-width: 1180px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .layout, .install { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .kpi:nth-child(3n) { border-right: 0; }
      .kpi { border-bottom: 1px solid var(--line); }
    }
    @media (max-width: 720px) {
      .shell { width: min(100% - 24px, 1440px); }
      .bar { position: static; }
      .controls { width: 100%; }
      #project-select { flex: 1; min-width: 0; }
      .grid { grid-template-columns: 1fr; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .kpi:nth-child(3n) { border-right: 1px solid var(--line); }
      .kpi:nth-child(2n) { border-right: 0; }
      .kpi-value strong { font-size: 1.35rem; }
      .chart-wrap svg { height: 180px; }
      .vitals { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; }
    }
  </style>
</head>

      <div class="controls">

  <div class="demo-banner" id="demo-banner" hidden>
    <div class="shell"><span><strong>Live demo.</strong> Sample data from six made-up sites. Your own dashboard looks exactly like this.</span><a class="btn small primary" href="../" data-perch-cta="get-started-demo">Get Perch</a></div>
  </div>
  <main class="shell" id="app" aria-live="polite">
    <div class="state"><div><div class="spinner" aria-hidden="true"></div><p>Finding your vantage point…</p></div></div>
  </main>

  <script>
    (function () {
      "use strict";

      var app = document.querySelector("#app");
      var projectSelect = document.querySelector("#project-select");
      var rangeSelect = document.querySelector("#range-select");
      var customRange = document.querySelector("#custom-range");
      var fromInput = document.querySelector("#from-input");
      var toInput = document.querySelector("#to-input");
      var compareToggle = document.querySelector("#compare-toggle");
      var exportLink = document.querySelector("#export-link");
      var livePill = document.querySelector("#live-pill");
      var liveText = document.querySelector("#live-text");
      var params = new URLSearchParams(location.search);
      var demo = params.has("demo") || /\.github\.io$/.test(location.hostname);
      var apiBase = params.get("endpoint") ? params.get("endpoint").replace(/\/+$/, "") : "";
      var DAY = 86400000;
      var RANGES = { today: 1, yesterday: 1, "7d": 7, "30d": 30, "90d": 90, "12m": 365 };
      var FILTER_LABELS = { channel: "Channel", referrer: "Referrer", campaign: "Campaign", source: "UTM source", medium: "UTM medium", page: "Page", country: "Country", lang: "Language", device: "Device", browser: "Browser", os: "OS", cta: "Clicked", event: "Triggered" };
      var state = {
        projects: [],
        selected: "all",
        range: "30d",
        from: "",
        to: "",
        compare: true,
        filters: [],
        metric: "uniques",
        sort: "uniques",
        direction: -1,
        tabs: {},
        lastOverview: null,
        lastRollup: null,
        poll: null,
        token: 0
      };

      // ----- formatting -------------------------------------------------
      function esc(value) {
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c];
        });
      }
      function fmt(value, digits) {
        return new Intl.NumberFormat(undefined, { maximumFractionDigits: digits == null ? 0 : digits }).format(Number(value) || 0);
      }
      function compact(value) {
        var n = Number(value) || 0;
        return n >= 10000 ? new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 }).format(n) : fmt(n);
      }
      function pct(value) {
        return fmt((Number(value) || 0) * 100, 1) + "%";
      }
      function duration(ms) {
        if (ms == null) return "—";
        var s = Math.round(ms / 1000);
        return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
      }
      function iso(date) {
        return new Date(date).toISOString().slice(0, 10);
      }
      function addDays(day, n) {
        return iso(Date.parse(day + "T00:00:00Z") + n * DAY);
      }
      function nice(day) {
        return new Date(day + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
      }
      function ago(ts) {
        if (!ts) return "never";
        var m = Math.round((Date.now() - Date.parse(ts)) / 60000);
        if (m < 2) return "just now";
        if (m < 60) return m + " minutes ago";
        var h = Math.round(m / 60);
        if (h < 48) return h + " hours ago";
        return Math.round(h / 24) + " days ago";
      }
      function delta(current, previous, rate) {
        if (!state.compare || previous == null) return "";
        var cur = Number(current) || 0, prev = Number(previous) || 0;
        if (rate) {
          var pt = (cur - prev) * 100;
          if (Math.abs(pt) < 0.05) return '<span class="delta flat">±0 pt</span>';
          return '<span class="delta ' + (pt > 0 ? "up" : "down") + '">' + (pt > 0 ? "+" : "−") + fmt(Math.abs(pt), 1) + " pt</span>";
        }
        if (!prev) return cur ? '<span class="delta up">new</span>' : "";
        var change = (cur - prev) / prev;
        if (Math.abs(change) < 0.005) return '<span class="delta flat">±0%</span>';
        return '<span class="delta ' + (change > 0 ? "up" : "down") + '">' + (change > 0 ? "+" : "−") + fmt(Math.abs(change) * 100, 0) + "%</span>";
      }
      function countryLabel(code) {
        if (!code || code === "XX" || code === "(unknown)") return "Unknown";
        var flag = String(code).toUpperCase().replace(/./g, function (c) { return String.fromCodePoint(127397 + c.charCodeAt(0)); });
        try {
          return flag + " " + new Intl.DisplayNames([navigator.language || "en"], { type: "region" }).of(String(code).toUpperCase());
        } catch (_) {
          return flag + " " + code;
        }
      }

      // ----- state <-> URL -------------------------------------------------
      function pref(key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (_) { return fallback; }
      }
      function savePref(key, value) {
        try { localStorage.setItem(key, value); } catch (_) {}
      }
      function readUrl() {
        var p = new URLSearchParams(location.search);
        state.selected = p.get("project") || pref("perch:last-project", "all");
        state.range = p.get("range") || pref("perch:date-range", "30d");
        if (state.range === "30") state.range = "30d";
        state.from = p.get("from") || "";
        state.to = p.get("to") || "";
        state.compare = p.get("compare") !== "0";
        state.metric = p.get("metric") === "pageviews" ? "pageviews" : "uniques";
        state.filters = p.getAll("filter").map(function (raw) {
          var i = raw.indexOf(":");
          return i > 0 ? { dim: raw.slice(0, i), value: raw.slice(i + 1) } : null;
        }).filter(function (f) { return f && FILTER_LABELS[f.dim]; });
      }
      function writeUrl(push) {
        var p = new URLSearchParams();
        if (demo) p.set("demo", "");
        if (apiBase) p.set("endpoint", apiBase);
        if (state.selected !== "all") p.set("project", state.selected);
        p.set("range", state.range);
        if (state.range === "custom") { p.set("from", state.from); p.set("to", state.to); }
        if (!state.compare) p.set("compare", "0");
        if (state.metric !== "uniques") p.set("metric", state.metric);
        state.filters.forEach(function (f) { p.append("filter", f.dim + ":" + f.value); });
        var url = location.pathname + "?" + p.toString().replace("demo=&", "demo&").replace(/demo=$/, "demo");
        history[push ? "pushState" : "replaceState"](null, "", url);
      }
      function range() {
        var today = iso(Date.now());
        if (state.range === "custom" && state.from && state.to && state.from <= state.to) return { from: state.from, to: state.to };
        if (state.range === "yesterday") return { from: addDays(today, -1), to: addDays(today, -1) };
        var days = RANGES[state.range] || 30;
        return { from: addDays(today, -(days - 1)), to: today };
      }
      function days(r) {
        var out = [];
        for (var d = r.from; d <= r.to; d = addDays(d, 1)) out.push(d);
        return out;
      }

      // ----- data ------------------------------------------------------------
      function AuthError() { this.name = "AuthError"; }
      AuthError.prototype = Object.create(Error.prototype);

      function getJson(path, options) {
        if (demo && window.PERCH_DEMO) return window.PERCH_DEMO.request(path, options);
        return fetch(apiBase + path, Object.assign({ headers: { accept: "application/json" }, redirect: "manual" }, options || {})).then(function (response) {
          if (response.status === 401 || response.status === 302 || response.type === "opaqueredirect") throw new AuthError();
          if (!response.ok) throw new Error("The data service returned " + response.status + ".");
          if (!(response.headers.get("content-type") || "").includes("application/json")) throw new AuthError();
          return response.json();
        });
      }
      function query(extra) {
        var r = range();
        var p = new URLSearchParams({ from: r.from, to: r.to });
        if (state.compare) p.set("compare", "1");
        Object.keys(extra || {}).forEach(function (k) { p.set(k, extra[k]); });
        state.filters.forEach(function (f) { p.append("filter", f.dim + ":" + f.value); });
        return p.toString();
      }
      function updateExport() {
        var r = range();
        var p = new URLSearchParams({ from: r.from, to: r.to });
        if (state.selected !== "all") p.set("projectId", state.selected);
        exportLink.href = apiBase + "/api/export.csv?" + p;
      }
      function setLive(n) {
        livePill.hidden = false;
        liveText.textContent = fmt(n) + (n === 1 ? " visitor now" : " visitors now");
      }
      function toast(message) {
        var t = document.createElement("div");
        t.className = "toast";
        t.setAttribute("role", "status");
        t.textContent = message;
        document.body.appendChild(t);
        setTimeout(function () { t.remove(); }, 2600);
      }
      function copy(text, button) {
        var done = function () { var old = button.textContent; button.textContent = "Copied"; setTimeout(function () { button.textContent = old; }, 1600); };
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
      }

      // ----- views ------------------------------------------------------------
      function loading() {
        app.innerHTML = '<div class="state"><div><div class="spinner" aria-hidden="true"></div><p>Gathering the view…</p></div></div>';
      }
      function showError(error) {
        var auth = error && error.name === "AuthError";
        app.innerHTML = '<div class="state"><section class="state-card"><h2>' + (auth ? "Please sign in again" : "The view is temporarily cloudy") + "</h2><p>" +
          (auth ? "Your secure dashboard session has expired. Reload to sign in through Cloudflare Access."
            : "Perch could not load your analytics. Check the Worker and database, then try once more.") +
          '</p><a class="btn primary" href="' + esc(location.href) + '">Reload dashboard</a></section></div>';
      }
      function rangeLabel(r) {
        return (r.from === r.to ? nice(r.from) : nice(r.from) + " – " + nice(r.to)) + " (UTC)";
      }

      function sparkline(values) {
        var max = Math.max.apply(null, values.concat([1]));
        var w = 104, h = 26;
        var pts = values.map(function (v, i) {
          return (values.length > 1 ? i / (values.length - 1) * w : w / 2).toFixed(1) + "," + (h - 2 - v / max * (h - 4)).toFixed(1);
        }).join(" ");
        var down = values.length > 3 && values.slice(-3).reduce(function (a, b) { return a + b; }, 0) < values.slice(0, 3).reduce(function (a, b) { return a + b; }, 0) * 0.7;
        return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (down ? "#b4472a" : "#2f6045") + '" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/></svg>';
      }
      function series(byDay, r, key) {
        var map = {};
        (byDay || []).forEach(function (d) { map[d.date] = Number(d[key]) || 0; });
        return days(r).map(function (d) { return map[d] || 0; });
      }

      function attentionFor(items) {
        var notes = [];
        items.forEach(function (item) {
          var stale = !item.lastEventAt || Date.now() - Date.parse(item.lastEventAt) > DAY;
          if (stale) {
            notes.push({ kind: "warn", project: item, title: item.name + (item.lastEventAt ? ": no events for " + ago(item.lastEventAt).replace(" ago", "") : ": waiting for its first event"),
              text: item.lastEventAt ? "The tag may have been removed in a deploy. Open the install check." : "Add the tracker tag to the site. The install check walks you through it." });
            return;
          }
          var prev = item.previous && item.previous.uniques;
          if (state.compare && prev >= 20) {
            var change = (item.uniques - prev) / prev;
            if (change <= -0.3) notes.push({ kind: "warn", project: item, title: item.name + ": visitors " + delta(item.uniques, prev).replace(/<[^>]+>/g, ""), text: "Down against the previous period. Compare its sources to see what changed." });
            else if (change >= 0.5) notes.push({ kind: "good", project: item, title: item.name + ": visitors " + delta(item.uniques, prev).replace(/<[^>]+>/g, ""), text: "A strong lift against the previous period." });
          }
          var top = (item.byChannel || []).slice(0, 2).map(function (c) { return c.name; });
          if (top.indexOf("AI assistants") >= 0) notes.push({ kind: "good", project: item, title: item.name + ": AI assistants are a top-2 source", text: "Visitors arriving from ChatGPT, Perplexity, Claude or Gemini." });
        });
        return notes;
      }

      function renderOverview(items) {
        state.lastOverview = items;
        var r = range();
        var sum = function (key, list) { return (list || items).reduce(function (a, i) { return a + (Number(i[key]) || 0); }, 0); };
        var prevSum = function (key) { return items.reduce(function (a, i) { return a + (Number(i.previous && i.previous[key]) || 0); }, 0); };
        var uniques = sum("uniques");
        var conv = uniques ? items.reduce(function (a, i) { return a + (Number(i.conversionRate) || 0) * (Number(i.uniques) || 0); }, 0) / uniques : 0;
        var prevUniques = prevSum("uniques");
        var prevConv = prevUniques ? items.reduce(function (a, i) { return a + (Number(i.previous && i.previous.conversionRate) || 0) * (Number(i.previous && i.previous.uniques) || 0); }, 0) / prevUniques : 0;
        var sessions = sum("sessions");
        var engaged = sessions ? items.reduce(function (a, i) { return a + (Number(i.engagedRate) || 0) * (Number(i.sessions) || 0); }, 0) / sessions : 0;
        var notes = attentionFor(items);
        var warnSites = {};
        notes.forEach(function (n) { if (n.kind === "warn") warnSites[n.project.projectId] = true; });
        var hasPrev = items.some(function (i) { return i.previous; });
        setLive(sum("realtime"));

        var sorted = items.slice().sort(function (a, b) {
          var key = state.sort;
          var av = key === "name" ? String(a.name).toLowerCase() : key === "change" ? changeOf(a) : Number(a[key]) || 0;
          var bv = key === "name" ? String(b.name).toLowerCase() : key === "change" ? changeOf(b) : Number(b[key]) || 0;
          return av < bv ? -state.direction : av > bv ? state.direction : 0;
        });
        function changeOf(i) { var p = i.previous && i.previous.uniques; return p ? (i.uniques - p) / p : (i.uniques ? 1 : 0); }
        var leader = items.slice().sort(function (a, b) { return (Number(b.pageviews) || 0) - (Number(a.pageviews) || 0); })[0];
        var channels = {};
        items.forEach(function (i) { (i.byChannel || []).forEach(function (c) { channels[c.name] = (channels[c.name] || 0) + (Number(c.visitors) || 0); }); });
        var channelList = Object.keys(channels).map(function (k) { return { name: k, visitors: channels[k], events: channels[k] }; }).sort(function (a, b) { return b.visitors - a.visitors; });

        var head = function (key, label) { return '<th><button type="button" data-sort="' + key + '">' + label + (state.sort === key ? (state.direction < 0 ? " ↓" : " ↑") : "") + "</button></th>"; };
        var rows = sorted.map(function (item, index) {
          var trend = series(item.byDay, r, "uv");
          var stale = warnSites[item.projectId] && (!item.lastEventAt || Date.now() - Date.parse(item.lastEventAt) > DAY);
          return '<tr class="project-row" tabindex="0" data-project="' + esc(item.projectId) + '" aria-label="Open ' + esc(item.name) + '">' +
            '<td><span class="rank' + (index === 0 ? " first" : "") + '">' + (index + 1) + '</span><span class="pname" style="display:inline-grid"><strong>' + esc(item.name) +
            (stale ? ' <span class="tag warn">' + (item.lastEventAt ? "No events · " + esc(ago(item.lastEventAt).replace(" ago", "")) : "Not installed") + "</span>" : "") +
            "</strong><small>" + esc(item.origin || item.projectId) + "</small></span></td>" +
            "<td><strong>" + fmt(item.uniques) + "</strong></td><td>" + (delta(item.uniques, item.previous && item.previous.uniques) || "—") + "</td>" +
            "<td>" + fmt(item.pageviews) + "</td><td>" + pct(item.conversionRate) + "</td>" +
            "<td>" + (item.realtime ? '<i class="dot" style="display:inline-block;margin-right:6px"></i>' : "") + fmt(item.realtime) + "</td>" +
            "<td>" + sparkline(trend) + "</td></tr>";
        }).join("");

        app.innerHTML =
          '<div class="title-row"><div><h1>All projects</h1><p class="sub">' + fmt(items.length) + (items.length === 1 ? " site · " : " sites · ") + esc(rangeLabel(r)) + (hasPrev ? " · compared with the previous period" : "") + "</p></div></div>" +
          (leader && leader.pageviews ? '<p class="insight"><strong>' + esc(leader.name) + "</strong> is attracting the most traffic this period.</p>" : "") +
          '<section class="kpis" style="--cols:5" aria-label="Portfolio totals">' +

      function kpi(label, value, extra, cls, attrs) {
        var tag = attrs ? "button" : "article";
        return "<" + tag + ' class="kpi' + (cls ? " " + cls : "") + '"' + (attrs || "") + (attrs ? ' type="button"' : "") + '><span class="kpi-label">' + label + '</span><span class="kpi-value"><strong>' + value + "</strong>" + (extra || "") + "</span></" + tag + ">";
      }

      function listHtml(items, dim, opts) {
        opts = opts || {};
        if (!items || !items.length) return '<p class="empty">' + (opts.empty || "Nothing to show for this period.") + "</p>";
        var max = Math.max.apply(null, items.map(function (i) { return Number(opts.valueKey ? i[opts.valueKey] : i.visitors) || 0; }).concat([1]));
        return '<div class="list"><div class="list-head"><span>' + esc(opts.col1 || "Name") + "</span><span>" + esc(opts.col2 || "Visitors") + "</span></div>" +
          items.slice(0, opts.limit || 8).map(function (item) {

            var label = opts.label ? opts.label(item.name) : item.name;

              (opts.tag && opts.tag(item) ? '<span class="tag">' + esc(opts.tag(item)) + "</span>" : "") +
              (opts.extra ? '<span class="row-extra">' + opts.extra(item) + "</span>" : "") +

          }).join("") + "</div>";
      }

      function chartSvg(cur, prev, r) {
        var w = 1000, h = 220, pad = 8;
        var max = Math.max.apply(null, cur.concat(prev || []).concat([1]));
        var x = function (i) { return cur.length > 1 ? i / (cur.length - 1) * w : w / 2; };
        var y = function (v) { return h - pad - v / max * (h - pad * 2); };
        var line = function (vals) { return vals.map(function (v, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); }).join(""); };
        var grid = [0.25, 0.5, 0.75].map(function (t) { return '<line x1="0" x2="' + w + '" y1="' + (pad + (h - pad * 2) * t).toFixed(1) + '" y2="' + (pad + (h - pad * 2) * t).toFixed(1) + '" stroke="#e4e2da" vector-effect="non-scaling-stroke"/>'; }).join("");
        return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-label="Daily ' + (state.metric === "uniques" ? "unique visitors" : "pageviews") + '">' + grid +
          '<path d="' + line(cur) + "L" + x(cur.length - 1).toFixed(1) + " " + h + "L0 " + h + 'Z" fill="#f0f7d9"/>' +
          (prev ? '<path d="' + line(prev) + '" fill="none" stroke="#cfccc1" stroke-width="1.5" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>' : "") +
          '<path d="' + line(cur) + '" fill="none" stroke="#2f6045" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
          '<line id="hover-line" x1="0" x2="0" y1="0" y2="' + h + '" stroke="#12201a" stroke-opacity=".25" vector-effect="non-scaling-stroke" visibility="hidden"/>' +
          '<rect id="hover-area" x="0" y="0" width="' + w + '" height="' + h + '" fill="transparent"/></svg>';
      }

      function panelHtml(panel, data) {

          "</div></div>" + listHtml(data[tab.key] || [], tab.dim, { col1: tab.col1, col2: tab.col2, extra: tab.extra, value: tab.value, valueKey: tab.valueKey, label: tab.label2, empty: tab.empty,
            tag: tab.key === "byChannel" ? function (i) { return i.name === "AI assistants" ? "AI" : ""; } : null }) + "</section>";

      function vitalsHtml(v) {
        var limits = { LCP: [2500, 4000, "ms"], INP: [200, 500, "ms"], CLS: [0.1, 0.25, ""] };
        var any = v && (v.LCP || v.INP || v.CLS);
        if (!any) return '<section class="card"><div class="card-head"><h2>Web Vitals</h2><span class="card-note">p75</span></div><p class="empty">Add <code>data-perf</code> to the tracker tag to collect LCP, INP and CLS.</p></section>';
        return '<section class="card"><div class="card-head"><h2>Web Vitals</h2><span class="card-note">75th percentile</span></div><div class="vitals">' +
          ["LCP", "INP", "CLS"].map(function (m) {
            var item = v[m];
            if (!item) return '<div class="vital"><small>' + m + "</small><strong>—</strong></div>";
            var l = limits[m];
            var cls = item.p75 <= l[0] ? "good" : item.p75 <= l[1] ? "mid" : "poor";
            var shown = m === "CLS" ? fmt(item.p75, 2) : (item.p75 >= 1000 ? fmt(item.p75 / 1000, 1) + " s" : fmt(item.p75) + " ms");
            return '<div class="vital ' + cls + '"><small>' + m + " · " + fmt(item.samples) + " samples</small><strong>" + shown + "</strong></div>";
          }).join("") + "</div></section>";
      }

      function renderDetail(data) {
        state.lastRollup = data;
        var project = state.projects.find(function (p) { return p.id === state.selected; }) || { name: state.selected };
        var r = range();
        var t = data.totals || {};
        var p = data.previous && data.previous.totals;
        setLive(t.realtime || 0);
        var cur = series(data.byDay, r, state.metric === "uniques" ? "uv" : "pv");
        var prevRange = data.previous ? { from: data.previous.range.from, to: data.previous.range.to } : null;
        var prev = prevRange ? series(data.previous.byDay, prevRange, state.metric === "uniques" ? "uv" : "pv") : null;
        if (prev && prev.length !== cur.length) prev = null;
        var ticks = [0, 0.25, 0.5, 0.75, 1].map(function (f) { var d = days(r); return nice(d[Math.round(f * (d.length - 1))]); });
        var chips = state.filters.map(function (f, i) {
          var shown = f.dim === "country" ? countryLabel(f.value) : f.value;
          return '<span class="chip">' + esc(FILTER_LABELS[f.dim]) + " is " + esc(shown) + ' <button type="button" aria-label="Remove filter" data-remove="' + i + '">×</button></span>';
        }).join("");

        app.innerHTML =
          '<div class="title-row"><div><h1>' + esc(project.name) + '</h1><p class="sub">' + (project.origin ? '<a href="' + esc(project.origin) + '" target="_blank" rel="noopener">' + esc(project.origin.replace(/^https?:\/\//, "")) + "</a> · " : "") + esc(rangeLabel(r)) +
          (p ? " · compared with " + esc(rangeLabel(prevRange)) : "") + '</p></div><button type="button" class="btn small" id="install-check">Install check</button></div>' +
          (chips ? '<div class="chips">' + chips + ' <button type="button" class="link-btn" id="clear-filters">Clear filters</button></div>' : "") +
          '<section class="kpis" style="--cols:6" aria-label="Project totals">' +
            kpi("Unique visitors", fmt(t.uniques), delta(t.uniques, p && p.uniques), "", ' data-metric="uniques" aria-pressed="' + (state.metric === "uniques") + '"') +
            kpi("Pageviews", fmt(t.pageviews), delta(t.pageviews, p && p.pageviews), "", ' data-metric="pageviews" aria-pressed="' + (state.metric === "pageviews") + '"') +
            kpi("Conversion rate", pct(t.conversionRate), delta(t.conversionRate, p && p.conversionRate, true)) +
            kpi("Engaged visits", pct(t.engagedRate), delta(t.engagedRate, p && p.engagedRate, true)) +
            (t.avgScroll != null ? kpi("Avg. scroll depth", t.avgScroll + "%", t.avgTimeMs ? '<span class="delta flat">' + duration(t.avgTimeMs) + " / page</span>" : "") : kpi("Pages / visit", fmt(t.pagesPerSession, 1), "")) +
            kpi('<i class="dot" aria-hidden="true"></i>Visitors now', fmt(t.realtime), "") +
          "</section>" +
          '<section class="card chart-card"><div class="card-head"><h2>Traffic over time</h2><div class="legend"><span><i></i>' + (state.metric === "uniques" ? "Unique visitors" : "Pageviews") + "</span>" + (prev ? '<span><i class="prev"></i>Previous period</span>' : "") + '</div><span class="grow"></span><span class="card-note">Hover a day for details</span></div>' +
            '<div class="chart-wrap" id="chart">' + chartSvg(cur, prev, r) + '<div class="axis">' + ticks.map(function (d) { return "<span>" + esc(d) + "</span>"; }).join("") + '</div><div class="tooltip" id="tooltip" hidden></div></div></section>' +
          '<div class="grid">' + PANELS.map(function (panel) { return panelHtml(panel, data); }).join("") + vitalsHtml(data.vitals) + "</div>" +
          '<p class="footer-note">Select any row to filter the whole view. Engaged visit = more than one page, a CTA or event, or 10+ seconds on the page. Sessions use a 30-minute window; visitors are anonymous daily hashes.</p>';

        var chart = document.querySelector("#chart");
        var area = chart.querySelector("#hover-area");
        var lineEl = chart.querySelector("#hover-line");
        var tip = chart.querySelector("#tooltip");
        var dayList = days(r);
        area.addEventListener("mousemove", function (event) {
          var box = area.getBoundingClientRect();
          var i = Math.max(0, Math.min(cur.length - 1, Math.round((event.clientX - box.left) / box.width * (cur.length - 1))));
          var xPos = cur.length > 1 ? i / (cur.length - 1) * 1000 : 500;
          lineEl.setAttribute("x1", xPos); lineEl.setAttribute("x2", xPos); lineEl.setAttribute("visibility", "visible");
          tip.hidden = false;
          tip.style.left = (box.left - chart.getBoundingClientRect().left + (cur.length > 1 ? i / (cur.length - 1) : 0.5) * box.width) + "px";
          tip.style.top = "12px";
          tip.innerHTML = "<b>" + esc(nice(dayList[i])) + " · " + fmt(cur[i]) + (state.metric === "uniques" ? " visitors" : " pageviews") + "</b>" +
            (prev ? "<span>" + fmt(prev[i]) + " in the previous period " + delta(cur[i], prev[i]).replace(/<[^>]+>/g, "") + "</span>" : "");
        });
        area.addEventListener("mouseleave", function () { tip.hidden = true; lineEl.setAttribute("visibility", "hidden"); });
        app.querySelectorAll("[data-metric]").forEach(function (b) { b.addEventListener("click", function () { state.metric = b.dataset.metric; writeUrl(); renderDetail(data); }); });
        app.querySelectorAll("[data-panel] [data-tab]").forEach(function (b) {

      function renderInstall(manual) {
        var project = state.projects.find(function (p) { return p.id === state.selected; }) || { id: state.selected, name: state.selected };
        var origin = demo ? "https://a.northwind.example" : (apiBase || location.origin);
        var snippet = '<script src="' + origin + '/perch.js"\n  data-project-id="' + project.id + '" defer></' + 'script>';
        var prompt = "Read INTEGRATION.md in github.com/tanzir71/perch and finish the Perch install for " + (project.origin || project.name) + ". Worker URL: " + origin + ". Project ID: " + project.id + ". Run section 10's checks and report the results.";
        var token = ++state.token;
        clearInterval(state.poll);
        livePill.hidden = true;
        function paint(status) {
          if (token !== state.token) return;
          var got = status.received || {};
          var hasView = got.pageview > 0, hasCta = got.cta > 0;
          var step = function (done, next, n, title, text, extra) {
            return '<div class="step"><span class="mark' + (done ? " done" : next ? " next" : "") + '">' + (done ? "✓" : n) + "</span><div><h3>" + title + (done ? ' <span class="tag">Done</span>' : next ? ' <span class="tag neutral">Next</span>' : "") + "</h3><p>" + text + "</p>" + (extra || "") + "</div></div>";
          };
          var waiting = !hasView;
          app.innerHTML =
            '<div class="title-row"><div><h1>' + esc(project.name) + '</h1><p class="sub">Install check' + (status.lastEventAt ? " · last event " + esc(ago(status.lastEventAt)) : "") + "</p></div>" + (hasView || manual ? '<button type="button" class="btn small primary" id="to-dashboard">Open the dashboard</button>' : "") + "</div>" +
            '<div class="install"><section class="card"><div class="install-head"><h2>' + (waiting ? '<span class="pulse" aria-hidden="true"></span>Waiting for the first event from ' + esc((project.origin || project.name).replace(/^https?:\/\//, "")) : "Perch is receiving events") + '</h2><p class="sub">' +
              (waiting ? "Listening for project “" + esc(project.id) + "”. This page checks again every few seconds." : fmt(got.pageview) + " recent pageviews, " + fmt(got.cta) + " CTA clicks.") + "</p></div>" +
              step(status.registered, false, 1, "Project registered", status.registered ? esc(project.id) + " · " + esc(project.name) + (project.origin ? " · " + esc(project.origin) : "") : "Run INTEGRATION.md section 4 so this project gets a friendly name. Beacons are accepted meanwhile only while no project is registered.") +
              step(hasView, !hasView, 2, "Add the tracker tag", "Paste this once, just before &lt;/body&gt;, on every page of the site.",
                '<div class="code"><button type="button" class="btn" id="copy-snippet">Copy</button><pre>' + esc(snippet) + '</pre></div><div class="actions-row">The script and its /collect endpoint come from this Worker, so nothing else needs configuring.</div>') +
              step(hasView, false, 3, "Open the site in a new tab", "The first pageview shows up here within a few seconds.",
                '<div class="actions-row"><button type="button" class="btn small" id="send-test">Send a test event</button><span id="test-result">Posts one labelled test event to /collect. Test events never count in totals.</span></div>') +
              step(hasCta, hasView && !hasCta, 4, "Click a tracked CTA", "Any element with data-perch-cta counts. It appears under Goals with its conversion rate.") +
            '</section><div class="stack"><section class="card"><div class="card-head"><h2>If nothing arrives</h2></div><div class="attention">' +
              [["An ad blocker is on", "Many block *.workers.dev. Serve this Worker from a subdomain of your site, such as a." + esc((project.origin || "example.com").replace(/^https?:\/\/(www\.)?/, "")) + "."],
               ["Do Not Track is on", "With data-respect-dnt, browsers that send DNT are skipped by design."],
               ["The endpoint is the dashboard URL", "A custom data-endpoint must end in /collect."],
               ["Cloudflare Access blocks /collect or /perch.js", "Both paths need the Bypass application from INTEGRATION.md."]].map(function (i) {
                return '<div class="alert"><span class="alert-icon" aria-hidden="true">?</span><div><strong>' + i[0] + "</strong><p>" + i[1] + "</p></div></div>";
              }).join("") +
            '</div></section><section class="agent"><h3>Let your AI agent finish it</h3><p>' + esc(prompt) + '</p><button type="button" class="btn small" id="copy-prompt">Copy prompt</button></section></div></div>';
          var bind = function (id, fn) { var el = document.querySelector(id); if (el) el.addEventListener("click", fn); };
          bind("#copy-snippet", function (e) { copy(snippet, e.currentTarget); });
          bind("#copy-prompt", function (e) { copy(prompt, e.currentTarget); });
          bind("#to-dashboard", function () { clearInterval(state.poll); state.token++; render(true); });
          bind("#send-test", function () {
            var out = document.querySelector("#test-result");
            var body = JSON.stringify({ type: "custom", name: "__perch_test", projectId: project.id, path: "/perch-install-check" });
            var send = demo && window.PERCH_DEMO ? window.PERCH_DEMO.collect(body) : fetch(origin + "/collect", { method: "POST", headers: { "content-type": "text/plain" }, body: body }).then(function (r) { return r.json(); });
            send.then(function (res) {
              out.textContent = res.ok ? "Test event received. Your Worker and database work; now add the tag to the site." : "The Worker answered: " + (res.error || "error") + ".";
            }, function () { out.textContent = "Could not reach /collect from here."; });
          });
        }
        function poll() {
          getJson("/api/status?projectId=" + encodeURIComponent(project.id)).then(paint, function (error) { if (token === state.token) showError(error); });
        }
        poll();
        state.poll = setInterval(poll, 5000);
      }

      // ----- controller -------------------------------------------------------
      function openProject(id) {
        state.selected = id;
        state.filters = [];
        projectSelect.value = id;
        savePref("perch:last-project", id);
        writeUrl(true);
        render();
      }

      function render(skipInstall) {
        clearInterval(state.poll);
        var token = ++state.token;
        loading();
        updateExport();
        if (state.selected === "all") {
          getJson("/api/overview?" + query()).then(function (items) { if (token === state.token) renderOverview(items); }, showError);
          return;
        }
        getJson("/api/rollup?" + query({ projectId: state.selected })).then(function (data) {
          if (token !== state.token) return;
          if ((data.totals && data.totals.pageviews) || (data.byCta && data.byCta.length)) return renderDetail(data);
          if (skipInstall || state.filters.length) return renderEmptyRange();
          return getJson("/api/status?projectId=" + encodeURIComponent(state.selected)).then(function (status) {
            if (token !== state.token) return;
            if (status.lastEventAt && (status.received.pageview || status.received.cta)) renderEmptyRange(); else renderInstall(false);
          });
        }).catch(function (error) { if (token === state.token) showError(error); });
      }

      function syncControls() {
        projectSelect.value = state.projects.some(function (p) { return p.id === state.selected; }) ? state.selected : "all";
        if (projectSelect.value === "all") state.selected = "all";
        if (!RANGES[state.range] && state.range !== "custom") state.range = "30d";
        rangeSelect.value = state.range;
        customRange.hidden = state.range !== "custom";
        var r = range();
        fromInput.value = r.from; toInput.value = r.to;
        compareToggle.checked = state.compare;
      }

      function init() {
        readUrl();
        getJson("/api/projects").then(function (projects) {
          state.projects = projects || [];
          state.projects.forEach(function (project) {
            var option = document.createElement("option");
            option.value = project.id;
            option.textContent = project.name;
            projectSelect.appendChild(option);
          });
          syncControls();
          writeUrl();
          render();
        }).catch(showError);
      }

      projectSelect.addEventListener("change", function () {
        state.selected = projectSelect.value;
        state.filters = [];
        savePref("perch:last-project", state.selected);
        writeUrl(true);
        render();
      });
      rangeSelect.addEventListener("change", function () {
        state.range = rangeSelect.value;
        if (state.range === "custom") { var r = range(); state.from = r.from; state.to = r.to; }
        customRange.hidden = state.range !== "custom";
        savePref("perch:date-range", state.range);
        writeUrl(true);
        render();
      });
      [fromInput, toInput].forEach(function (input) {
        input.addEventListener("change", function () {
          if (fromInput.value && toInput.value && fromInput.value <= toInput.value) { state.from = fromInput.value; state.to = toInput.value; writeUrl(true); render(); }
        });
      });
      compareToggle.addEventListener("change", function () { state.compare = compareToggle.checked; writeUrl(true); render(); });
      exportLink.addEventListener("click", function (event) { if (demo) { event.preventDefault(); toast("Export is turned off in the demo."); } });
      addEventListener("popstate", function () { readUrl(); syncControls(); render(); });
      var resizeTimer;
      addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { if (state.selected !== "all" && state.lastRollup && document.querySelector("#chart")) renderDetail(state.lastRollup); }, 200); });

      if (demo) {
        document.querySelector("#demo-banner").hidden = false;
        var s = document.createElement("script");
        s.src = "./demo-data.js";
        s.onload = init;
        s.onerror = function () { showError(new Error("Demo data is missing.")); };
        document.head.appendChild(s);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
