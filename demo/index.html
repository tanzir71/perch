<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perch demo landing page</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #17221b; background: #f4f1e8; }
    header, main { width: min(960px, calc(100% - 40px)); margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
    .brand { font-weight: 800; letter-spacing: -.04em; }
    nav a { margin-left: 18px; color: inherit; }
    .hero { min-height: 70vh; display: grid; align-content: center; gap: 24px; }
    .eyebrow { color: #557460; font-size: .8rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 780px; margin: 0; font-size: clamp(3rem, 8vw, 6.6rem); letter-spacing: -.075em; line-height: .92; }
    p { max-width: 620px; color: #526158; font-size: 1.15rem; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    .button { display: inline-flex; padding: 14px 20px; border-radius: 999px; border: 1px solid #17221b; color: inherit; text-decoration: none; font-weight: 750; }
    .button.primary { color: #fff; background: #17221b; }
    button.button { cursor: pointer; background: transparent; font: inherit; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Northwind</div>
    <nav aria-label="Primary">
      <a href="#about">About</a>
      <a href="https://example.com/resources">Resources</a>
    </nav>
  </header>
  <main>
    <section class="hero" id="about">
      <span class="eyebrow">A Perch instrumentation demo</span>
      <h1>Small signals. Better launches.</h1>
      <p>This sample page exercises every tracker path without changing the page structure.</p>
      <div class="actions">
        <a class="button primary" href="#contact" data-perch-cta="contact-hero">Start a project</a>
        <button class="button" type="button" data-perch-cta="newsletter-hero">Join the newsletter</button>
        <a class="button" href="https://developer.mozilla.org/">Read the field guide</a>
        <a class="button" href="#about">Internal link</a>
        <button class="button" id="custom-event" type="button">Save preference</button>
      </div>
    </section>
  </main>

  <script
    src="../src/perch.js"
    data-endpoint="https://YOUR-PERCH-WORKER.workers.dev/collect"
    data-project-id="perch-demo"
    defer
  ></script>
  <script>
    document.querySelector("#custom-event").addEventListener("click", function () {
      window.perch?.track("preference_saved", { surface: "demo", theme: "quiet" });
    });
  </script>
</body>
</html>
